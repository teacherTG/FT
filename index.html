        // Helper to handle exponential backoff for fetch
        const fetchWithRetry = async (url, options, retries = 3, delay = 1000) => {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response;
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(res => setTimeout(res, delay * Math.pow(2, i)));
                }
            }

                        {
                            question: "[백업 모드 10/10] 근력 운동의 강도를 설정할 때 기준이 되는 '1RM'이 의미하는 것은 무엇일까요?",
                            options: ["1분 동안 가장 빠르게 달린 거리", "정확한 자세로 딱 1번 들어 올릴 수 있는 최고 무게", "하루에 할 수 있는 최대 팔굽혀펴기 횟수", "1시간 동안 소모하는 칼로리 양"],
                            answer: "정확한 자세로 딱 1번 들어 올릴 수 있는 최고 무게",
                            explanation: "1RM(Repetition Maximum)은 1회 최대 반복을 의미하며, 자신의 100% 한계 근력을 뜻합니다."
                        }
                    ]);
                    setQuizState('playing');
                }
            };

            const getHint = async (questionText, wrongAnswer) => {
                setQuizState('evaluating');
                setHint("");
                try {
                    const prompt = `학생이 체육 퀴즈를 틀렸습니다. 정답을 직접적으로 알려주지 말고, 중학교 1학년 수준에 맞춰 게임, 마라탕, 학교생활 등의 친숙하고 재미있는 비유를 활용해 정답을 스스로 유추할 수 있도록 힌트를 1~2문장으로 주세요.
                    문제: "${questionText}"
                    학생이 고른 오답: "${wrongAnswer}"`;

                    const payload = { contents: [{ parts: [{ text: prompt }] }] };
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_FLASH}:generateContent?key=${API_KEY}`;
                    
                    const res = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    const hintText = data.candidates[0].content.parts[0].text;
                    setHint(hintText);
                } catch (error) {
                    console.error("Hint generation error:", error);
                    setHint("시스템 오류로 AI 힌트를 불러올 수 없습니다. 교재를 다시 한번 천천히 읽어보세요!");
                }
            };

            const handleAnswerSelect = async (option) => {
                if (quizState === 'evaluating') return;
                setSelectedAnswer(option);
                const currentQ = questions[currentIndex];

                if (option === currentQ.answer) {
                    setScore(prev => prev + 1);
                    setTimeout(() => {
                        handleNext();
                    }, 1000); 
                } else {
                    await getHint(currentQ.question, option);
                }
            };

            const handleNext = () => {
                setHint("");
                setSelectedAnswer(null);
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setQuizState('playing');
                } else {
                    setQuizState('result');
                }
            };

            if (quizState === 'generating') {
                return (
                    <div className="flex flex-col items-center justify-center h-80 text-sys-accent">
                        <div className="loader mb-5 w-10 h-10 border-4 border-t-sys-accent"></div>
                        <p className="font-mono text-xl glitch-text" data-text="Connecting to System... Generating Diagnostic Test...">Connecting to System... Generating Diagnostic Test...</p>
                    </div>
                );
            }

            if (quizState === 'result') {
                return (
                    <div className="text-center p-6 sm:p-10 sys-panel rounded-xl animate-[fadeIn_0.5s_ease-out]">
                        <i className={`fa-solid ${score === questions.length ? 'fa-check-circle text-sys-accent' : 'fa-triangle-exclamation text-sys-warning'} text-[80px] mb-5`}></i>
                        <h2 className="text-3xl sm:text-4xl font-bold mb-3">진단 테스트 완료</h2>
                        <p className="text-xl sm:text-2xl mb-6">최종 점수: <span className="font-mono text-sys-accent text-3xl font-bold">{score}</span> / {questions.length}</p>
                        
                        <div className="bg-slate-800 p-5 rounded-xl text-left mb-6 text-sys-muted text-lg sm:text-xl leading-relaxed">
                            {score === questions.length ? 
                                "완벽합니다! OS 업데이트 승인 조건이 모두 충족되었습니다. 당장 운동을 시작하셔도 좋습니다." : 
                                "일부 시스템 패치가 필요합니다. 복습 메뉴얼을 다시 확인하고 재부팅(재도전) 해주세요."}
                        </div>

                        <div className="flex flex-col sm:flex-row justify-center gap-4">
                            <button onClick={generateQuestions} className="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-lg transition-colors">
                                <i className="fa-solid fa-rotate-right mr-2"></i>재시험
                            </button>
                            <button onClick={onComplete} className="px-6 py-3 bg-sys-accent hover:bg-sys-accentHover text-slate-900 rounded-lg font-bold text-lg transition-colors shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                                <i className="fa-solid fa-book-open mr-2"></i>복습 메뉴로
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQ = questions[currentIndex];

            return (
                <div className="sys-panel p-6 md:p-10 rounded-2xl max-w-3xl w-full mx-auto animate-[fadeIn_0.3s_ease-out] shadow-2xl">
                    <div className="flex justify-between items-center mb-6 border-b-2 border-slate-700 pb-3">
                        <h3 className="font-mono text-sys-accent font-bold text-xl">
                            <i className="fa-solid fa-terminal mr-2"></i>Diagnostic_Q{currentIndex + 1}.exe
                        </h3>
                        <span className="text-sys-muted font-mono text-lg">{currentIndex + 1} / {questions.length}</span>
                    </div>

                    <p className="text-xl sm:text-2xl mb-6 leading-relaxed font-bold">{currentQ.question}</p>

                    <div className="flex flex-col gap-3 mb-6">
                        {currentQ.options.map((opt, idx) => {
                            let btnStyle = "bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700";
                            
                            if (selectedAnswer === opt) {
                                if (opt === currentQ.answer) {
                                    btnStyle = "bg-sys-accent text-slate-900 border-sys-accent shadow-[0_0_15px_rgba(16,185,129,0.5)]"; 
                                } else {
                                    btnStyle = "bg-sys-danger text-white border-sys-danger opacity-75"; 
                                }
                            } else if (selectedAnswer && opt === currentQ.answer && selectedAnswer === currentQ.answer) {
                                btnStyle = "bg-sys-accent text-slate-900 border-sys-accent"; 
                            }

                            return (
                                <button 
                                    key={idx}
                                    onClick={() => handleAnswerSelect(opt)}
                                    disabled={quizState === 'evaluating' || (selectedAnswer === currentQ.answer)}
                                    className={`text-left p-4 rounded-xl border-2 transition-all duration-200 text-lg font-medium ${btnStyle} ${quizState === 'evaluating' ? 'cursor-not-allowed opacity-50' : ''}`}
                                >
                                    <span className="font-mono mr-3 opacity-50 text-lg">{idx + 1}.</span> {opt}
                                </button>
                            )
                        })}
                    </div>

                    {quizState === 'evaluating' && hint === "" && (
                        <div className="p-5 bg-slate-900 border-2 border-sys-warning rounded-xl text-sys-warning flex items-center">
                            <div className="loader mr-3 border-sys-warning !border-t-yellow-200"></div>
                            <span className="font-mono text-base font-bold">AI Coach 분석 중... 오답 원인을 파악하고 힌트를 생성합니다...</span>
                        </div>
                    )}

                    {hint && selectedAnswer !== currentQ.answer && (
                        <div className="p-5 bg-slate-900 border-2 border-sys-info rounded-xl animate-[fadeIn_0.3s_ease-out]">
                            <h4 className="text-sys-info font-bold mb-2 flex items-center text-lg">
                                <i className="fa-solid fa-robot mr-2 text-xl"></i>AI Coach의 힌트 도착!
                            </h4>
                            <p className="text-lg text-slate-200 leading-relaxed font-medium">{hint}</p>
                            <p className="text-sm text-sys-muted mt-3 font-mono cursor-pointer hover:text-white" onClick={() => setSelectedAnswer(null)}>
                                > 다시 풀어보려면 이곳을 클릭하거나 다른 보기를 선택하세요.
                            </p>
                        </div>
                    )}

                    {selectedAnswer === currentQ.answer && (
                        <div className="p-5 bg-emerald-900/60 border-2 border-sys-accent rounded-xl text-sys-accent font-bold text-lg animate-[fadeIn_0.3s_ease-out]">
                            <i className="fa-solid fa-circle-check mr-2 text-xl"></i>정답입니다! 다음 패치로 이동합니다...
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('review'); 
            const [expandedCategory, setExpandedCategory] = useState(0); 
            const [activeContent, setActiveContent] = useState({ categoryIdx: 0, subIdx: 0 }); 

            const renderReview = () => (
                <div className="flex flex-col h-full max-w-6xl w-full mx-auto p-4 sm:p-6 animate-[fadeIn_0.3s_ease-out]">
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4 sm:gap-6">
                        <h2 className="text-2xl sm:text-3xl font-bold font-mono text-sys-info border-b-4 border-sys-info pb-2 inline-block">
                            <i className="fa-solid fa-book-open mr-3"></i>체력 운동 복습 APP
                        </h2>
                        <button onClick={() => setCurrentView('quiz')} className="w-full sm:w-auto px-6 py-3 bg-sys-accent hover:bg-sys-accentHover text-slate-900 rounded-xl font-bold text-lg transition-all duration-300 shadow-[0_0_15px_rgba(16,185,129,0.4)] hover:shadow-[0_0_25px_rgba(16,185,129,0.7)] flex items-center justify-center transform hover:-translate-y-1">
                            테스트 시작하기 <i className="fa-solid fa-arrow-right ml-3"></i>
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-6 flex-grow">
                        <div className="w-full lg:w-1/3 flex flex-col gap-3">
                            {reviewContent.map((category, catIdx) => (
                                <div key={category.id} className="flex flex-col gap-2">
                                    <button
                                        onClick={() => {
                                            const isExpanding = expandedCategory !== catIdx;
                                            setExpandedCategory(isExpanding ? catIdx : null);
                                            if (isExpanding) {
                                                setActiveContent({ categoryIdx: catIdx, subIdx: 0 });
                                            }
                                        }}
                                        className={`text-left p-4 rounded-xl transition-all flex items-center justify-between shadow-md text-base sm:text-lg ${expandedCategory === catIdx ? 'bg-slate-700 text-white font-bold border-l-[6px] border-sys-info' : 'bg-slate-800/60 text-sys-muted hover:bg-slate-700/80 border-l-[6px] border-transparent'}`}
                                    >
                                        <div className="flex items-center gap-3">
                                            <i className={`fa-solid ${category.icon} w-8 text-center text-xl ${expandedCategory === catIdx ? 'text-sys-info' : ''}`}></i>
                                            {category.title}
                                        </div>
                                        <i className={`fa-solid fa-chevron-${expandedCategory === catIdx ? 'up' : 'down'} text-base opacity-70`}></i>
                                    </button>
                                    
                                    <div className={`flex flex-col gap-1 ml-5 border-l-2 border-slate-600 pl-3 overflow-hidden transition-all duration-300 ${expandedCategory === catIdx ? 'max-h-[500px] mt-2' : 'max-h-0'}`}>
                                        {category.subItems.map((subItem, subIdx) => {
                                            const isActive = activeContent.categoryIdx === catIdx && activeContent.subIdx === subIdx;
                                            return (
                                                <button
                                                    key={subIdx}
                                                    onClick={() => setActiveContent({ categoryIdx: catIdx, subIdx: subIdx })}
                                                    className={`text-left p-3 rounded-lg transition-all text-base font-bold ${isActive ? 'bg-sys-info/20 text-sys-info shadow-inner border border-sys-info/30' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}
                                                >
                                                    {subItem.title}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                        
                        <div className="w-full lg:w-2/3 sys-panel p-6 sm:p-8 rounded-2xl relative overflow-hidden flex flex-col justify-center min-h-[500px]">
                            <i className={`fa-solid ${reviewContent[activeContent.categoryIdx].icon} absolute -bottom-10 -right-10 text-[120px] sm:text-[150px] text-slate-800/30`}></i>
                            
                            <h3 className="text-2xl sm:text-3xl font-bold mb-6 text-white z-10 relative flex items-center gap-3">
                                {reviewContent[activeContent.categoryIdx].subItems[activeContent.subIdx].title}
                            </h3>
                            <div 
                                className="z-10 relative text-base sm:text-lg leading-relaxed content-html bg-slate-900/40 p-5 sm:p-6 rounded-xl border border-slate-700/60 mb-3 shadow-inner"
                                dangerouslySetInnerHTML={{__html: reviewContent[activeContent.categoryIdx].subItems[activeContent.subIdx].content}}
                            />
                            
                            {reviewContent[activeContent.categoryIdx].subItems[activeContent.subIdx].miniQuiz && (
                                <div className="z-10 relative">
                                    <MiniQuiz quiz={reviewContent[activeContent.categoryIdx].subItems[activeContent.subIdx].miniQuiz} />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col flex-grow relative z-10">
                    <header className="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/60 backdrop-blur-md shadow-md">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('review')}>
                            <i className="fa-solid fa-heart-pulse text-sys-accent text-2xl"></i>
                            <span className="font-mono font-bold tracking-widest text-base sm:text-lg">FITNESS_REVIEW_APP</span>
                        </div>
                        <div className="font-mono text-sm sm:text-base text-sys-muted bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                            Status: <span className="text-sys-accent font-bold">Online</span>
                        </div>
                    </header>

                    <main className="flex-grow flex flex-col items-center p-4 sm:p-6">
                        {currentView === 'review' && renderReview()}
                        {currentView === 'quiz' && (
                            <div className="w-full flex-grow flex flex-col mt-6 sm:mt-10 relative">
                                <button onClick={() => setCurrentView('review')} className="absolute -top-12 right-2 text-sys-muted hover:text-white transition-colors bg-slate-800 p-2 rounded-full w-10 h-10 flex justify-center items-center">
                                    <i className="fa-solid fa-xmark text-2xl"></i>
                                </button>
                                <QuizEngine onComplete={() => setCurrentView('review')} />
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <!-- Utility style for injected HTML content -->
    <style>
        .content-html strong { color: #f8fafc; font-weight: 700; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
